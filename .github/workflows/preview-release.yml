name: Preview release

# Publishes a preview build of a pull request to npm and Docker Hub, so a fix can
# be tried by the people affected before it is merged. Run it manually from the
# Actions tab ("Run workflow" on main) and enter the pull request number.
#
# A preview is a changesets snapshot of the PR's changesets, for example
# `mysa2mqtt@3.3.0-pr306.20261012133331`. Only packages with a changeset (and
# their dependents) are published, under the npm dist-tag `pr-<number>`; the
# Docker image is pushed as `bourquep/mysa2mqtt:pr-<number>` and under its exact
# version. Previews never move `latest`, and create no commit, git tag,
# CHANGELOG entry or GitHub release.
#
# Trust model: this publishes the PR's code under the project's npm and Docker
# Hub names, so review the PR before running it. Fork PRs are refused unless
# explicitly allowed. The PR's code runs only in jobs that hold no publishing
# credentials: `prepare` installs, versions, builds and packs it; `npm`
# publishes the resulting tarballs without checking anything out or running
# lifecycle scripts; `docker` executes the PR only inside the BuildKit build,
# which cannot read the runner's Docker Hub login.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: number
      allow-fork:
        description: 'Allow a pull request from a fork (review its code first)'
        type: boolean
        default: false

concurrency:
  group: preview-release-${{ inputs.pr }}
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: 24.x
  PR: ${{ inputs.pr }}

jobs:
  prepare:
    # Same guard as release.yml: workflow_dispatch accepts any ref, and the
    # workflow file is read from that ref. Only main's copy may publish, so a
    # branch cannot change how previews are built or which secrets they see.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      packages: ${{ steps.packages.outputs.packages }}
      mysa2mqtt-version: ${{ steps.packages.outputs.mysa2mqtt-version }}

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FORK: ${{ inputs.allow-fork }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::'$PR' is not a pull request number"
            exit 1
          fi

          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,isCrossRepository)
          state=$(jq -r .state <<< "$info")
          if [ "$state" != 'OPEN' ]; then
            echo "::error::Pull request #$PR is $state; only open pull requests can be previewed"
            exit 1
          fi
          if [ "$(jq -r .isCrossRepository <<< "$info")" = 'true' ] && [ "$ALLOW_FORK" != 'true' ]; then
            echo "::error::Pull request #$PR comes from a fork. Review its code, then re-run with 'allow-fork' checked"
            exit 1
          fi

          # Pin the commit once: every job builds exactly this commit, even if
          # the PR is pushed to while the workflow runs.
          echo "sha=$(jq -r .headRefOid <<< "$info")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      # No `cache: 'npm'`: this run belongs to main, so a cache it saved would be
      # restored by main's own workflows, and its contents come from the PR.
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      # The snapshot settings are applied here rather than committed to
      # .changeset/config.json so that every PR, including one branched before
      # this workflow existed, gets the same version scheme. The changelog is
      # disabled because previews ship no release notes, and generating them
      # would call the GitHub API.
      - name: Version packages as a snapshot
        run: |
          set -euo pipefail
          config=.changeset/config.json
          jq '.changelog = false | .snapshot = {useCalculatedVersion: true, prereleaseTemplate: "{tag}.{datetime}"}' \
            "$config" > "$RUNNER_TEMP/config.json"
          mv "$RUNNER_TEMP/config.json" "$config"

          npx changeset version --snapshot "pr$PR"
          # Same as `npm run version-packages`: keep the lockfile in step with
          # the new versions, which the Docker build's `npm ci` requires.
          npm install --package-lock-only --ignore-scripts

      - name: Collect preview packages
        id: packages
        run: |
          set -euo pipefail
          packages='[]'
          for manifest in packages/*/package.json; do
            name=$(jq -r .name "$manifest")
            version=$(jq -r .version "$manifest")
            # Packages without a changeset keep their published version.
            if [[ "$version" != *"-pr$PR."* ]]; then
              continue
            fi

            # A provenance attestation would name main's commit (the workflow's
            # ref) as the source, which is not what a preview is built from.
            jq 'del(.publishConfig.provenance)' "$manifest" > "$RUNNER_TEMP/package.json"
            mv "$RUNNER_TEMP/package.json" "$manifest"

            packages=$(jq -c --arg name "$name" --arg version "$version" '. + [{name: $name, version: $version}]' <<< "$packages")
            if [ "$name" = 'mysa2mqtt' ]; then
              echo "mysa2mqtt-version=$version" >> "$GITHUB_OUTPUT"
            fi
          done

          if [ "$packages" = '[]' ]; then
            echo "::error::Pull request #$PR has no changeset, so there is nothing to preview"
            exit 1
          fi

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "Preview: \(.name)@\(.version)"' <<< "$packages"

      - run: npm run build

      - name: Pack
        env:
          PACKAGES: ${{ steps.packages.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/preview/tarballs"
          for name in $(jq -r '.[].name' <<< "$PACKAGES"); do
            npm pack -w "$name" --pack-destination "$RUNNER_TEMP/preview/tarballs"
          done

          # The Docker build starts from the same commit and reapplies these
          # changes, so the image reports the preview version.
          git diff --binary > "$RUNNER_TEMP/preview/snapshot.patch"

      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          retention-days: 7

  npm:
    needs: prepare
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v8
        with:
          name: preview
          path: ${{ runner.temp }}/preview

      # Libraries first, so a failure never leaves mysa2mqtt pointing at a
      # library version that does not exist. Already-published versions are
      # skipped, which makes "Re-run failed jobs" safe.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          set -euo pipefail
          for name in mqtt2ha mysa-js-sdk mysa2mqtt; do
            version=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .version' <<< "$PACKAGES")
            if [ -z "$version" ]; then
              continue
            fi

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi

            npm publish "$RUNNER_TEMP/preview/tarballs/$name-$version.tgz" \
              --tag "pr-$PR" --access public --ignore-scripts
          done

  docker:
    needs: prepare
    if: needs.prepare.outputs.mysa2mqtt-version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: preview
          path: ${{ runner.temp }}/preview

      - name: Apply snapshot versions
        run: git apply "$RUNNER_TEMP/preview/snapshot.patch"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # Reads main's layer cache but never writes to it: a cache saved by this
      # run would be restored by release builds, and its layers come from the PR.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/mysa2mqtt/Dockerfile
          cache-from: type=gha
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bourquep/mysa2mqtt:pr-${{ env.PR }}
            bourquep/mysa2mqtt:${{ needs.prepare.outputs.mysa2mqtt-version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.mysa2mqtt-version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}

  comment:
    needs: [prepare, npm, docker]
    # `docker` is skipped when the PR does not change mysa2mqtt; only a failure
    # should suppress the comment.
    if: ${{ !cancelled() && needs.npm.result == 'success' && needs.docker.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          M2M_VERSION: ${{ needs.prepare.outputs.mysa2mqtt-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf ':test_tube: **Preview build** of %s published ([workflow run](%s)).\n\n' "${SHA:0:7}" "$RUN_URL"
            jq -r '.[] | "- `\(.name)@\(.version)` — [npm](https://www.npmjs.com/package/\(.name)/v/\(.version))"' <<< "$PACKAGES"

            if [ -n "$M2M_VERSION" ]; then
              printf '\nTo try it, run the Docker image:\n\n```bash\ndocker pull bourquep/mysa2mqtt:pr-%s\n```\n' "$PR"
              printf '\nor install it from npm:\n\n```bash\nnpm install -g mysa2mqtt@pr-%s\n```\n' "$PR"
            fi

            printf '\nThis is an unreleased preview of this pull request; the `pr-%s` tags move to the newest preview.\n' "$PR"
          } > "$RUNNER_TEMP/comment.md"

          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
