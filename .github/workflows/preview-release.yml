name: Preview release

# Publishes a preview build of a pull request to npm and Docker Hub, so a fix can
# be tried by the people affected before it is merged. Run it manually from the
# Actions tab ("Run workflow" on main) and enter the pull request number.
#
# A preview is a changesets snapshot of the PR's changesets, for example
# `mysa2mqtt@3.3.0-pr306.20261012133331`. Only packages with a changeset (and
# their dependents) are published, under the npm dist-tag `pr-<number>`; the
# Docker image is pushed as `bourquep/mysa2mqtt:pr-<number>` and under its exact
# version. Previews never move `latest`, and create no commit, git tag,
# CHANGELOG entry or GitHub release.
#
# Trust model: this publishes the PR's code under the project's npm and Docker
# Hub names, so review the PR before running it. Fork PRs are refused unless
# explicitly allowed.
#
# npm publishing uses trusted publishing (OIDC), like release.yml: each package
# on npmjs.com must list this workflow file as a trusted publisher.
#
# This workflow runs on main, so it never executes the PR's code on its
# runners: doing so would let that code poison main's Actions cache, which the
# CI and release workflows restore. The `preview` job of ci.yml installs,
# versions, builds and packs the PR in the PR's own context instead; this
# workflow only validates and publishes the tarballs that job uploaded, for the
# PR's latest commit and only once its CI run has passed. The Docker image is
# built from that same commit, with the PR's code confined to the BuildKit
# build, which can reach neither the cache nor the runner's Docker Hub login.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number'
        required: true
        type: number
      allow-fork:
        description: 'Allow a pull request from a fork (review its code first)'
        type: boolean
        default: false

concurrency:
  group: preview-release-${{ inputs.pr }}
  cancel-in-progress: false

permissions: {}

env:
  NODE_VERSION: 24.x
  PR: ${{ inputs.pr }}

jobs:
  resolve:
    # Same guard as release.yml: workflow_dispatch accepts any ref, and the
    # workflow file is read from that ref. Only main's copy may publish, so a
    # branch cannot change how previews are validated or which secrets they see.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read # find the PR's CI run and download its artifact
      pull-requests: read
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      packages: ${{ steps.validate.outputs.packages }}
      mysa2mqtt-version: ${{ steps.validate.outputs.mysa2mqtt-version }}

    steps:
      - name: Resolve pull request and its CI run
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_FORK: ${{ inputs.allow-fork }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::'$PR' is not a pull request number"
            exit 1
          fi

          info=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,isCrossRepository)
          state=$(jq -r .state <<< "$info")
          if [ "$state" != 'OPEN' ]; then
            echo "::error::Pull request #$PR is $state; only open pull requests can be previewed"
            exit 1
          fi
          if [ "$(jq -r .isCrossRepository <<< "$info")" = 'true' ] && [ "$ALLOW_FORK" != 'true' ]; then
            echo "::error::Pull request #$PR comes from a fork. Review its code, then re-run with 'allow-fork' checked"
            exit 1
          fi

          # Pin the commit once: every job works from exactly this commit, even
          # if the PR is pushed to while the workflow runs.
          sha=$(jq -r .headRefOid <<< "$info")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event pull_request --commit "$sha" \
            --json databaseId,status,conclusion --jq 'first // empty')
          if [ -z "$run" ] || [ "$(jq -r .status <<< "$run")" != 'completed' ]; then
            echo "::error::CI has not finished for ${sha:0:7}, the latest commit of #$PR. Wait for it, then try again"
            exit 1
          fi
          if [ "$(jq -r .conclusion <<< "$run")" != 'success' ]; then
            echo "::error::CI did not pass for ${sha:0:7}, the latest commit of #$PR; only passing commits can be previewed"
            exit 1
          fi
          echo "ci-run-id=$(jq -r .databaseId <<< "$run")" >> "$GITHUB_OUTPUT"

      # Downloaded outside the workspace, and only ever read as data. A PR
      # without a changeset, or branched before ci.yml built previews, has no
      # such artifact, and this step fails.
      - name: Download the CI preview build
        uses: actions/download-artifact@v8
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ steps.pr.outputs.ci-run-id }}
          github-token: ${{ github.token }}

      # The artifact comes from a run of the PR's own code, so check that it
      # holds exactly what a preview may publish: known packages, at snapshot
      # versions of this PR, whose tarballs say the same.
      - name: Validate the preview build
        id: validate
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/preview"
          packages=$(jq -c '[.[] | {name, version}]' "$dir/packages.json")

          if [ "$packages" = '[]' ]; then
            echo "::error::The CI preview build of #$PR is empty"
            exit 1
          fi
          if [ "$(jq '[.[].name] | length == (unique | length)' <<< "$packages")" != 'true' ]; then
            echo "::error::The CI preview build of #$PR lists a package more than once"
            exit 1
          fi

          for name in $(jq -r '.[].name' <<< "$packages"); do
            case "$name" in
              mqtt2ha | mysa-js-sdk | mysa2mqtt) ;;
              *)
                echo "::error::Unexpected package '$name' in the CI preview build"
                exit 1
                ;;
            esac

            version=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .version' <<< "$packages")
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pr$PR\.[0-9]+$ ]]; then
              echo "::error::$name@$version is not a snapshot version of #$PR"
              exit 1
            fi

            tarball="$dir/tarballs/$name-$version.tgz"
            if [ ! -f "$tarball" ]; then
              echo "::error::The CI preview build of #$PR has no tarball for $name@$version"
              exit 1
            fi

            manifest=$(tar -xOzf "$tarball" package/package.json)
            if [ "$(jq -r '"\(.name)@\(.version)"' <<< "$manifest")" != "$name@$version" ]; then
              echo "::error::The $name-$version.tgz tarball does not contain $name@$version"
              exit 1
            fi

            if [ "$name" = 'mysa2mqtt' ]; then
              echo "mysa2mqtt-version=$version" >> "$GITHUB_OUTPUT"
            fi
          done

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "Preview: \(.name)@\(.version)"' <<< "$packages"

      - uses: actions/upload-artifact@v7
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          retention-days: 7

  npm:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing: npm exchanges this job's OIDC token for a
      # short-lived publish token. Every package must list this workflow
      # (`preview-release.yml`) as a trusted publisher on npmjs.com, next to
      # release.yml; there is no npm token secret.
      id-token: write

    steps:
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: preview
          path: ${{ runner.temp }}/preview

      # Libraries first, so a failure never leaves mysa2mqtt pointing at a
      # library version that does not exist. Already-published versions are
      # skipped, which makes "Re-run failed jobs" safe.
      - name: Publish to npm
        env:
          # Trusted publishing attests provenance by default, and the
          # attestation would name main's commit and this workflow as the
          # source rather than the pull request's commit.
          NPM_CONFIG_PROVENANCE: 'false'
          PACKAGES: ${{ needs.resolve.outputs.packages }}
        run: |
          set -euo pipefail
          for name in mqtt2ha mysa-js-sdk mysa2mqtt; do
            version=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .version' <<< "$PACKAGES")
            if [ -z "$version" ]; then
              continue
            fi

            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi

            npm publish "$RUNNER_TEMP/preview/tarballs/$name-$version.tgz" \
              --tag "pr-$PR" --access public --ignore-scripts
          done

  docker:
    needs: resolve
    if: needs.resolve.outputs.mysa2mqtt-version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: preview
          path: ${{ runner.temp }}/preview

      - name: Apply snapshot versions
        run: git apply "$RUNNER_TEMP/preview/snapshot.patch"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # No layer cache, in either direction: the build runs the PR's code, and
      # main's cache is shared with release builds.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/mysa2mqtt/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            bourquep/mysa2mqtt:pr-${{ env.PR }}
            bourquep/mysa2mqtt:${{ needs.resolve.outputs.mysa2mqtt-version }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.mysa2mqtt-version }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}

  comment:
    needs: [resolve, npm, docker]
    # `docker` is skipped when the PR does not change mysa2mqtt; only a failure
    # should suppress the comment.
    if: ${{ !cancelled() && needs.npm.result == 'success' && needs.docker.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PACKAGES: ${{ needs.resolve.outputs.packages }}
          M2M_VERSION: ${{ needs.resolve.outputs.mysa2mqtt-version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            printf ':test_tube: **Preview build** of %s published ([workflow run](%s)).\n\n' "${SHA:0:7}" "$RUN_URL"
            jq -r '.[] | "- `\(.name)@\(.version)` — [npm](https://www.npmjs.com/package/\(.name)/v/\(.version))"' <<< "$PACKAGES"

            if [ -n "$M2M_VERSION" ]; then
              printf '\nTo try it, run the Docker image:\n\n```bash\ndocker pull bourquep/mysa2mqtt:pr-%s\n```\n' "$PR"
              printf '\nor install it from npm:\n\n```bash\nnpm install -g mysa2mqtt@pr-%s\n```\n' "$PR"
            fi

            printf '\nThis is an unreleased preview of this pull request; the `pr-%s` tags move to the newest preview.\n' "$PR"
          } > "$RUNNER_TEMP/comment.md"

          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
